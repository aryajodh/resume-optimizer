<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatHeader {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .animate-float {
            animation: floatHeader 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-pink-50 to-indigo-50 min-h-screen text-gray-700 font-sans p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        
        <!-- Animated Header -->
        <header class="text-center mb-10 animate-float">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-800 inline-block bg-white/80 backdrop-blur-md px-8 py-4 rounded-3xl shadow-sm border border-pink-100">
                Let's help you <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-blue-500">get this job!</span> 
            </h1>
        </header>

        <!-- Main Card Container -->
        <div class="bg-white/90 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-blue-50 grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <!-- Resume Input Box -->
            <div class="flex flex-col">
                <label class="block font-semibold text-gray-700 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Your Resume Text
                </label>
                <textarea id="resume" class="w-full h-64 p-4 border border-blue-100 rounded-2xl focus:ring-2 focus:ring-pink-300 focus:outline-none bg-blue-50/30 text-sm leading-relaxed transition resize-none" placeholder="Paste your resume content here..."></textarea>
            </div>

            <!-- Job Description Input Box -->
            <div class="flex flex-col">
                <label class="block font-semibold text-gray-700 mb-2 flex items-center gap-2">
                    <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 132.75A19.988 19.988 0 013 20m18-10.75A19.99 19.99 0 003 4m18 10.75V4.25A2.25 2.25 0 0018.75 2H5.25A2.25 2.25 0 003 4.25v15.5A2.25 2.25 0 005.25 22h13.5A2.25 2.25 0 0021 19.75v-4.75z"></path></svg>
                    Target Job Description
                </label>
                <textarea id="job" class="w-full h-64 p-4 border border-pink-100 rounded-2xl focus:ring-2 focus:ring-blue-300 focus:outline-none bg-pink-50/30 text-sm leading-relaxed transition resize-none" placeholder="Paste target job description here..."></textarea>
            </div>
        </div>

        <!-- Action Button -->
        <div class="text-center mb-10">
            <button onclick="optimize()" id="optimize-btn" class="bg-gradient-to-r from-blue-400 to-pink-400 text-white font-bold px-10 py-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all duration-200">
                Optimize Resume
            </button>
        </div>

        <!-- Output Section -->
        <div id="results-container" class="hidden bg-white/90 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-pink-50">
            <h2 class="text-2xl font-bold mb-4 text-gray-800 flex items-center gap-2">
                <span class="w-3 h-3 bg-pink-400 rounded-full inline-block"></span>
                Optimization Results & Suggestions
            </h2>
            <div id="output" class="p-6 bg-blue-50/30 border border-blue-100 rounded-2xl text-gray-700 text-sm leading-relaxed whitespace-pre-wrap min-h-[150px]"></div>
        </div>

    </div>

    <script>
        async function optimize() {
            const resume = document.getElementById('resume').value;
            const job = document.getElementById('job').value;
            const output = document.getElementById('output');
            const resultsContainer = document.getElementById('results-container');
            const btn = document.getElementById('optimize-btn');
            
            if (!resume.trim() || !job.trim()) {
                alert("Please fill in both your resume and the job description!");
                return;
            }

            // Show results container and loading text
            resultsContainer.classList.remove('hidden');
            output.innerText = "✨ Gemini is carefully tailoring your resume to match the job description...";
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('http://localhost:8000/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume_text: resume, job_description: job })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    output.innerText = "Server Error: " + (data.detail || JSON.stringify(data));
                } else {
                    output.innerText = data.result;
                }
            } catch (err) {
                output.innerText = "Network Error: Could not connect to the backend server. Make sure Uvicorn is running!";
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
